version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: growth_agent
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./backend/migrations/002_harness.sql:/docker-entrypoint-initdb.d/002_harness.sql:ro
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://dev:dev@db:5432/growth_agent
      TELEMETRY_DIR: /data/telemetry/qa_steps
    ports: ["8000:8000"]
    depends_on: [db]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - telemetry:/data/telemetry
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata: {}
  telemetry: {}
